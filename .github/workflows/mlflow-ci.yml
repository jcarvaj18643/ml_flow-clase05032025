name: MLflow CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.8"

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run tests
      - name: Run tests
        run: |
          pytest tests/

      # Lint code
      - name: Lint code with flake8
        run: |
          pip install flake8
          flake8 .

      # Check MLflow model
      - name: Validate MLflow model
        run: |
          pip install mlflow
          mlflow models validate -m models:/<model-name>/1
